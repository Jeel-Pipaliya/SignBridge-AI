# SignBridge AI - Week 4 Training Configuration

# Model Architecture
model:
  type: "mlp"                  # Options: "mlp", "svm", "random_forest"
  input_dim: 63                # 21 landmarks * 3 coordinates
  hidden_units: [128, 64]      # Layer topology for MLP
  activation: "relu"
  dropout: 0.2                 # Represented via alpha L2 regularization (0.001)
  alpha: 0.001

# Training Hyperparameters
training:
  batch_size: 32
  max_epochs: 100
  learning_rate_init: 0.001
  learning_rate: "adaptive"    # Options: "constant", "invscaling", "adaptive"
  random_seed: 42
  early_stopping: true
  early_stopping_patience: 10
  validation_fraction: 0.15
  test_fraction: 0.15
  shuffle: true

# Real-Time & Inference Parameters
inference:
  confidence_threshold: 0.70
  smoothing_window: 5
  debounce_seconds: 0.8
  consecutive_confirm_frames: 6

# Storage Paths
paths:
  train_data: "data/processed/train.csv"
  val_data: "data/processed/val.csv"
  test_data: "data/processed/test.csv"
  all_data: "data/processed/processed_landmarks.csv"
  checkpoints_dir: "models/checkpoints"
  best_model_dir: "models/best"
  metadata_dir: "models/metadata"
  reports_dir: "reports"
  experiments_file: "experiments/experiment_log.csv"

# Week 5 Dynamic Gesture Recognition
dynamic:
  enabled: true
  sequence_length: 30
  feature_dimension: 63
  hidden_size: 128
  num_layers: 2
  dropout: 0.3
  learning_rate: 0.001
  batch_size: 32
  epochs: 50
  confidence_threshold: 0.70
  inference_interval: 2
  movement_threshold: 0.02
  cooldown_seconds: 1.5
  classes:
    - HELLO
    - J
    - Z
  paths:
    raw_dir: "data/dynamic/raw"
    sequences_dir: "data/dynamic/sequences"
    processed_dir: "data/dynamic/processed"
    models_dir: "models/dynamic"
    best_model: "models/dynamic/bilstm_dynamic.pt"
    baseline_model: "models/dynamic/baseline_dynamic.pkl"
    metadata_dir: "models/metadata"

# Week 5 ISL Grammar Correction & Translation
grammar:
  enabled: true
  default_language: "en"
  supported_languages:
    - "en"
    - "hi"

# Week 5 Text-to-Speech (TTS)
tts:
  enabled: true
  default_language: "en"
  auto_speak: false
  rate: 150
  volume: 1.0
