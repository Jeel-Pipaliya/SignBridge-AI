version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: signbridge_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-signbridge_db}
      POSTGRES_USER: ${POSTGRES_USER:-signbridge_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-signbridge_secure_password_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-signbridge_user} -d ${POSTGRES_DB:-signbridge_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: signbridge_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-signbridge_user}:${POSTGRES_PASSWORD:-signbridge_secure_password_2026}@db:5432/${POSTGRES_DB:-signbridge_db}
      - SECRET_KEY=${SECRET_KEY:-signbridge-super-secret-key-prod-2026}
      - CONFIDENCE_THRESHOLD=0.70
      - STATIC_MODEL_PATH=models/best/isl_classifier.pkl
      - DYNAMIC_MODEL_PATH=models/dynamic/bilstm_dynamic.pt
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: signbridge_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
    driver: local
