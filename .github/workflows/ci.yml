name: SignBridge AI Automated CI Checks

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend & AI Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install System Dependencies for OpenCV / Audio
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 espeak

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install fastapi uvicorn pydantic pydantic-settings sqlalchemy alembic bcrypt pyjwt python-multipart httpx pytest email-validator

      - name: Run Database Migrations & Seeding Check
        run: |
          python -m backend.app.db.seed

      - name: Run Automated Test Suite (96 Tests)
        run: |
          python -m unittest discover -s tests -p "test_*.py"

  frontend-build:
    name: Frontend TypeScript & Vite Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Typecheck and Build Distribution
        working-directory: ./frontend
        run: npm run build
